
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="270"
     viewBox="0 0 1200 270">

  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#090B14"/>
      <stop offset=".5" stop-color="#290D21"/>
      <stop offset="1" stop-color="#090B14"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="270" rx="20"
        fill="url(#bg)"/>

  <rect x="5" y="5" width="1190" height="260"
        rx="17" fill="none" stroke="#8C1944"/>

  <rect x="5" y="5" width="1190" height="260"
        rx="17" fill="none" stroke="#FF527E"
        stroke-width="2"
        stroke-dasharray="120 900"
        filter="url(#glow)">
    <animate attributeName="stroke-dashoffset"
             values="1020;0"
             dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Project icon -->

  <rect x="25" y="25" width="175" height="220"
        rx="15" fill="#310E25"
        stroke="#701A3D"/>

  <g transform="translate(112 115)"
     stroke="#FF527E" fill="none">

    <circle r="53" stroke-dasharray="5 8">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0" to="360"
        dur="15s"
        repeatCount="indefinite"/>
    </circle>

    <circle r="39" opacity=".6"/>

  </g>

  <text x="112" y="130"
        text-anchor="middle"
        font-family="monospace"
        font-size="40"
        fill="#FF91B2">{ }</text>

  <text x="112" y="216"
        text-anchor="middle"
        font-family="monospace"
        font-size="19"
        fill="#FF91B2">01</text>

  <!-- Category -->

  <text x="235" y="43"
        font-family="monospace"
        font-size="16"
        letter-spacing="3"
        fill="#FF527E">
    DISTRIBUTED SYSTEMS
  </text>

  <!-- Project title -->

  <text x="235" y="91"
        font-family="Arial,sans-serif"
        font-size="38"
        font-weight="bold"
        fill="#FFF5F8">
    MeshWeaver
  </text>

  <!-- Description -->

  <text x="235" y="133"
        font-family="Arial,sans-serif"
        font-size="22"
        fill="#E5B5C7">
    Peer-to-peer asynchronous task broker
  </text>

  <text x="235" y="169"
        font-family="monospace"
        font-size="18"
        fill="#FF91B2">
    Python / Asyncio / UDP
  </text>

  <!-- Status -->

  <circle cx="244" cy="224" r="6"
          fill="#FF527E" filter="url(#glow)">
    <animate attributeName="opacity"
             values=".3;1;.3"
             dur="2s"
             repeatCount="indefinite"/>
  </circle>

  <text x="265" y="230"
        font-family="monospace"
        font-size="16"
        fill="#E5B5C7">
    IN DEVELOPMENT
  </text>

  <!-- Project button -->

  <rect x="930" y="194" width="240" height="48"
        rx="8" fill="#8C1944"
        stroke="#FF527E"/>

  <text x="1050" y="225"
        text-anchor="middle"
        font-family="monospace"
        font-size="18"
        fill="#FFFFFF">
    VIEW PROJECT
  </text>

</svg>
