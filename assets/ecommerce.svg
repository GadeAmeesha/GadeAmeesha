
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="270"
     viewBox="0 0 1200 270">

  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#090B14"/>
      <stop offset=".5" stop-color="#290D21"/>
      <stop offset="1" stop-color="#090B14"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="270"
        rx="20" fill="url(#bg)"/>

  <rect x="5" y="5" width="1190" height="260"
        rx="17" fill="none" stroke="#8C1944"/>

  <!-- Animated border -->

  <rect x="5" y="5" width="1190" height="260"
        rx="17" fill="none"
        stroke="#FF527E" stroke-width="2"
        stroke-dasharray="120 900"
        filter="url(#glow)">
    <animate attributeName="stroke-dashoffset"
             values="1020;0" dur="6s"
             repeatCount="indefinite"/>
  </rect>

  <!-- Testing icon background -->

  <rect x="25" y="25" width="175" height="220"
        rx="15" fill="#310E25"
        stroke="#701A3D"/>

  <!-- Animated checklist -->

  <rect x="72" y="55" width="80" height="110"
        rx="9" fill="none"
        stroke="#FF527E" stroke-width="3"/>

  <g stroke="#FF91B2" stroke-width="4"
     stroke-linecap="round" fill="none">

    <path d="M84 80L91 87L102 73">
      <animate attributeName="opacity"
               values=".2;1;1;.2"
               dur="4s" repeatCount="indefinite"/>
    </path>

    <path d="M110 80H139"/>

    <path d="M84 110L91 117L102 103">
      <animate attributeName="opacity"
               values=".2;1;1;.2"
               begin=".7s" dur="4s"
               repeatCount="indefinite"/>
    </path>

    <path d="M110 110H139"/>

    <path d="M84 140L91 147L102 133">
      <animate attributeName="opacity"
               values=".2;1;1;.2"
               begin="1.4s" dur="4s"
               repeatCount="indefinite"/>
    </path>

    <path d="M110 140H139"/>

  </g>

  <text x="112" y="216"
        text-anchor="middle"
        font-family="monospace"
        font-size="19"
        fill="#FF91B2">02</text>

  <!-- Category -->

  <text x="235" y="43"
        font-family="monospace"
        font-size="16"
        letter-spacing="3"
        fill="#FF527E">
    QUALITY ASSURANCE
  </text>

  <!-- Title -->

  <text x="235" y="91"
        font-family="Arial,sans-serif"
        font-size="38" font-weight="bold"
        fill="#FFF5F8">
    E-commerce Website Testing
  </text>

  <!-- Description -->

  <text x="235" y="133"
        font-family="Arial,sans-serif"
        font-size="22"
        fill="#E5B5C7">
    60 test cases | End-to-end workflow testing
  </text>

  <text x="235" y="169"
        font-family="monospace"
        font-size="18"
        fill="#FF91B2">
    Manual Testing / Test Documentation
  </text>

  <!-- Animated status -->

  <circle cx="244" cy="224" r="6"
          fill="#FF527E" filter="url(#glow)">
    <animate attributeName="opacity"
             values=".3;1;.3"
             dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="265" y="230"
        font-family="monospace"
        font-size="16" fill="#E5B5C7">
    QA PROJECT
  </text>

  <!-- View project -->

  <rect x="930" y="194" width="240" height="48"
        rx="8" fill="#8C1944"
        stroke="#FF527E"/>

  <text x="1050" y="225"
        text-anchor="middle"
        font-family="monospace"
        font-size="18" fill="#FFFFFF">
    VIEW PROJECT
  </text>

</svg>
