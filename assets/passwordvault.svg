
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#090B14"/>
      <stop offset=".5" stop-color="#290D21"/>
      <stop offset="1" stop-color="#090B14"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="270" rx="20" fill="url(#bg)"/>

  <rect x="5" y="5" width="1190" height="260" rx="17"
        fill="none" stroke="#8C1944"/>

  <rect x="5" y="5" width="1190" height="260" rx="17"
        fill="none" stroke="#FF527E" stroke-width="2"
        stroke-dasharray="120 900" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset"
             values="1020;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <rect x="25" y="25" width="175" height="220" rx="15"
        fill="#310E25" stroke="#701A3D"/>

  <!-- Animated security lock -->

  <g fill="none" stroke="#FF527E" stroke-width="4">
    <path d="M80 112V85A32 32 0 0 1 144 85V112"/>
    <rect x="62" y="112" width="100" height="68" rx="12"/>
  </g>

  <g fill="#FF91B2" filter="url(#glow)">
    <circle cx="112" cy="138" r="7"/>
    <rect x="108" y="138" width="8" height="20" rx="3"/>
    <animate attributeName="opacity" values=".3;1;.3"
             dur="3s" repeatCount="indefinite"/>
  </g>

  <text x="112" y="216" text-anchor="middle"
        font-family="monospace" font-size="19" fill="#FF91B2">03</text>

  <text x="235" y="43" font-family="monospace"
        font-size="16" letter-spacing="3" fill="#FF527E">
    SOFTWARE DEVELOPMENT
  </text>

  <text x="235" y="91" font-family="Arial,sans-serif"
        font-size="38" font-weight="bold" fill="#FFF5F8">
    PasswordVault
  </text>

  <text x="235" y="133" font-family="Arial,sans-serif"
        font-size="22" fill="#E5B5C7">
    Password management with two-factor authentication
  </text>

  <text x="235" y="169" font-family="monospace"
        font-size="18" fill="#FF91B2">
    Python / Flask / SQLite
  </text>

  <circle cx="244" cy="224" r="6" fill="#FF527E" filter="url(#glow)">
    <animate attributeName="opacity" values=".3;1;.3"
             dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="265" y="230" font-family="monospace"
        font-size="16" fill="#E5B5C7">SECURITY APPLICATION</text>

  <rect x="930" y="194" width="240" height="48" rx="8"
        fill="#8C1944" stroke="#FF527E"/>

  <text x="1050" y="225" text-anchor="middle"
        font-family="monospace" font-size="18" fill="#FFFFFF">
    VIEW PROJECT
  </text>
</svg>
