
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420"
     viewBox="0 0 1200 420">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080509"/>
      <stop offset=".48" stop-color="#350F22"/>
      <stop offset="1" stop-color="#080509"/>
    </linearGradient>

    <linearGradient id="rose">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset=".5" stop-color="#F0B9D0"/>
      <stop offset="1" stop-color="#8B3158"/>
    </linearGradient>

    <radialGradient id="light">
      <stop offset="0" stop-color="#C77B9B" stop-opacity=".35"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none"
            stroke="#D99AB5" stroke-opacity=".09"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->

  <rect width="1200" height="420" rx="22" fill="url(#background)"/>
  <rect width="1200" height="420" rx="22" fill="url(#grid)"/>

  <ellipse cx="950" cy="210" rx="350" ry="300" fill="url(#light)">
    <animate attributeName="opacity"
             values=".35;.8;.35"
             dur="6s"
             repeatCount="indefinite"/>
  </ellipse>

  <!-- Animated orbits -->

  <g transform="translate(955 210)"
     fill="none" stroke="#C77B9B" stroke-opacity=".2">

    <circle r="172" stroke-dasharray="3 11">
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0 0 0"
                        to="360 0 0"
                        dur="35s"
                        repeatCount="indefinite"/>
    </circle>

    <circle r="190" stroke-dasharray="2 14">
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="360 0 0"
                        to="0 0 0"
                        dur="45s"
                        repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main heading -->

  <text x="50" y="58"
        font-family="Arial,sans-serif"
        font-size="15"
        letter-spacing="4"
        fill="#E5B5C7">
    DEVELOPER / QA ENGINEER
  </text>

  <text x="46" y="142"
        font-family="Arial,sans-serif"
        font-size="59"
        font-weight="bold"
        fill="#FFF5F8">
    GADE AMEESHA
  </text>

  <rect x="51" y="164" width="420" height="3"
        rx="2" fill="url(#rose)">
    <animate attributeName="width"
             values="120;420;120"
             dur="6s"
             repeatCount="indefinite"/>
  </rect>

  <text x="51" y="208"
        fill="#E5B5C7"
        font-family="Arial,sans-serif"
        font-size="24">
    Software Developer | QA Engineer
  </text>

  <text x="51" y="246"
        font-family="Arial,sans-serif"
        font-size="15"
        letter-spacing="2"
        fill="#C77B9B">
    6 MONTHS OF INDUSTRY EXPERIENCE
  </text>

  <!-- Technology badges -->

  <g font-family="Arial,sans-serif"
     font-size="15"
     text-anchor="middle"
     fill="#FFF5F8">

    <rect x="51" y="277" width="116" height="36"
          rx="7" fill="#701A3D" stroke="#A64D72"/>
    <text x="109" y="300">PYTHON</text>

    <rect x="180" y="277" width="116" height="36"
          rx="7" fill="#701A3D" stroke="#A64D72"/>
    <text x="238" y="300">JAVA</text>

    <rect x="309" y="277" width="116" height="36"
          rx="7" fill="#701A3D" stroke="#A64D72"/>
    <text x="367" y="300">C#</text>

    <rect x="438" y="277" width="116" height="36"
          rx="7" fill="#701A3D" stroke="#A64D72"/>
    <text x="496" y="300">SQL</text>

  </g>

  <!-- Developer terminal -->

  <rect x="708" y="75" width="437" height="261"
        rx="15" fill="#10070C"
        stroke="#8C3158" stroke-width="1.5"/>

  <path d="M708 115H1145"
        stroke="#8C3158" stroke-width="1"/>

  <circle cx="732" cy="95" r="6" fill="#E5B5C7"/>
  <circle cx="752" cy="95" r="6" fill="#C77B9B"/>
  <circle cx="772" cy="95" r="6" fill="#701A3D"/>

  <text x="925" y="100"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        fill="#C77B9B">
    developer_terminal
  </text>

  <g font-family="monospace" font-size="18">

    <text x="738" y="151" fill="#C77B9B">
      $ whoami
    </text>

    <text x="738" y="181" fill="#FFFFFF">
      software_developer
    </text>

    <text x="738" y="210" fill="#FFFFFF">
      qa_engineer
    </text>

    <text x="738" y="249" fill="#C77B9B">
      $ mission
    </text>

    <text x="738" y="279" fill="#E5B5C7">
      build. test. innovate.
    </text>

    <rect x="738" y="296" width="11" height="19"
          fill="#E5B5C7">
      <animate attributeName="opacity"
               values="1;0;1"
               dur="1s"
               repeatCount="indefinite"/>
    </rect>

  </g>

  <!-- Floating particles -->

  <g fill="#E5B5C7">

    <circle cx="650" cy="85" r="2.5">
      <animate attributeName="cy"
               values="85;55;85"
               dur="5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="660" cy="290" r="2.5">
      <animate attributeName="cy"
               values="290;260;290"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1100" cy="45" r="2.5">
      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Footer -->

  <path d="M38 368 H1162"
        stroke="#701A3D"
        stroke-width="1"/>

  <text x="600" y="398"
        font-family="Arial,sans-serif"
        font-size="15"
        letter-spacing="5"
        text-anchor="middle"
        fill="#E5B5C7">
    BUILD • TEST • INNOVATE • IMPROVE
  </text>

</svg>
