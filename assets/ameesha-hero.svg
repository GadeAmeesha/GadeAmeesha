<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="55%" stop-color="#351020"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>

    <linearGradient id="wine">
      <stop offset="0%" stop-color="#701A3D"/>
      <stop offset="50%" stop-color="#E5B5C7"/>
      <stop offset="100%" stop-color="#701A3D"/>
      <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>

  <ellipse cx="970" cy="170" rx="280" ry="180" fill="url(#glow)">
    <animate attributeName="opacity" values=".4;1;.4" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="none" stroke="#C77B9B" stroke-opacity=".35">
    <circle cx="970" cy="175" r="110"/>
    <circle cx="970" cy="175" r="145" stroke-dasharray="5 9">
      <animateTransform attributeName="transform" type="rotate" from="0 970 175" to="360 970 175" dur="35s" repeatCount="indefinite"/>
    </circle>
    <circle cx="970" cy="175" r="75" stroke-dasharray="3 8"/>
  </g>

  <path d="M650 290 Q820 80 1030 145 T1190 70"
        fill="none" stroke="url(#wine)" stroke-width="2"
        stroke-dasharray="12 9">
    <animate attributeName="stroke-dashoffset" values="0;-100" dur="8s" repeatCount="indefinite"/>
  </path>

  <text x="75" y="76" fill="#C77B9B"
        font-family="Arial" font-size="14" letter-spacing="5">
    DEVELOPER • CREATOR • PROBLEM SOLVER
  </text>

  <text x="72" y="163" fill="#F8F0F3"
        font-family="Arial" font-size="66" font-weight="bold">
    GADE AMEESHA
  </text>

  <rect x="76" y="185" width="350" height="3" rx="2" fill="url(#wine)">
    <animate attributeName="width" values="180;350;180" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="76" y="235" fill="#E5B5C7"
        font-family="Arial" font-size="25">
    Software Developer | QA Engineer
  </text>

  <text x="77" y="277" fill="#C77B9B"
        font-family="Arial" font-size="14" letter-spacing="3">
    BUILD • TEST • LEARN • IMPROVE
  </text>

  <g fill="#E5B5C7" opacity=".7" font-family="monospace" font-size="18">
    <text x="840" y="112">&lt;/&gt;</text>
    <text x="1090" y="250">{ }</text>
    <text x="765" y="220">01</text>
  </g>

  <path d="M30 330 H1170" stroke="#701A3D"/>
  <circle cx="75" cy="330" r="3" fill="#C77B9B"/>
</svg>
