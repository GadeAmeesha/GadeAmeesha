
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: GadeAmeesha
          outputs: |
            dist/github-snake.svg?color_snake=#DC2856&color_dots=#ebedf0,#ffc9db,#f783ac,#dc2856,#8c1944
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF527E&color_dots=#161b22,#4a102b,#8c1944,#dc2856,#ff91b2

      - name: Publish Snake Animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
